name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Code herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System-Pakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev

      - name: Buildozer installieren
        run: |
          pip install buildozer cython==0.29.33

      - name: APK kompilieren
        env:
          CFLAGS: "-Wno-error=incompatible-function-pointer-types -Wno-error=implicit-function-declaration"
        run: |
          buildozer -v android debug

      - name: Fertige APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: Neon-Maze-Pro-APK
          path: bin/*.apk
